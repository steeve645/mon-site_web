<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulateur de Compilation APK</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: linear-gradient(135deg, #1e1e2f, #2b2b3f);
      font-family: Arial, sans-serif;
      color: white;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
    }

    input[type="file"] {
      display: none;
    }

    .custom-upload {
      background: #4CAF50;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-bottom: 20px;
    }

    #compileBtn {
      background: #2196F3;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      color: white;
      cursor: pointer;
      display: none;
    }

    #progress {
      width: 80%;
      height: 20px;
      background: #444;
      margin: 20px auto;
      border-radius: 10px;
      overflow: hidden;
      display: none;
    }

    #bar {
      height: 100%;
      width: 0;
      background: #00e676;
      transition: width 0.2s;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Simulation Compilation APK</h1>

    <label class="custom-upload">
      Choisir un fichier APK
      <input type="file" id="fileInput" accept=".zip,.apk,.py,.txt" />
    </label>

    <button id="compileBtn" onclick="simulerCompilation()">Compiler</button>

    <div id="progress">
      <div id="bar"></div>
    </div>

    <div id="result"></div>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const compileBtn = document.getElementById("compileBtn");
    const progress = document.getElementById("progress");
    const bar = document.getElementById("bar");
    const result = document.getElementById("result");

    fileInput.addEventListener("change", () => {
      if (fileInput.files.length > 0) {
        compileBtn.style.display = "inline-block";
        result.innerHTML = "";
      }
    });

    function simulerCompilation() {
      compileBtn.disabled = true;
      result.innerHTML = "";
      bar.style.width = "0%";
      progress.style.display = "block";

      let pourcentage = 0;
      const interval = setInterval(() => {
        pourcentage += Math.floor(Math.random() * 10) + 5;
        bar.style.width = Math.min(pourcentage, 100) + "%";

        if (pourcentage >= 100) {
          clearInterval(interval);
          progress.style.display = "none";
          compileBtn.disabled = false;

          const success = Math.random() > 0.3;
          if (success) {
            result.innerHTML = "<span style='color:lightgreen;'>✅ Compilation réussie !</span>";
          } else {
            result.innerHTML = "<span style='color:red;'>❌ Erreur lors de la compilation.</span>";
          }
        }
      }, 300);
    }
  </script>
</body>
</html>
